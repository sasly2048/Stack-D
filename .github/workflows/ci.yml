name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  rls:
    # Real RLS/IDOR tests need a live Postgres + GoTrue. GitHub runners have
    # Docker, so we boot the local Supabase stack here (the suite auto-skips
    # anywhere Docker is absent, e.g. a dev laptop without it).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies all migrations)
        run: supabase start

      - name: Point tests at the local stack
        run: |
          # Export the local stack's URL + keys for the RLS suite. `supabase
          # status -o env` prints API_URL / ANON_KEY / SERVICE_ROLE_KEY.
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: RLS / IDOR tests
        run: bun run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: bun run dev &
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "dev server never became ready" && exit 1

      - name: End-to-end smoke suite
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: tests/e2e/artifacts/
